services:
  postgres:
    image: postgres:16
    container_name: exchange_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
      POSTGRES_DB: db_exchange
    ports:
      - "5432:5432"
    volumes:
      - exchange-postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  exchange-postgres-data: